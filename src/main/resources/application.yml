server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lostfound?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 🌟 新增：MyBatis-Plus 核心配置
mybatis-plus:
  # 映射所有自定义复杂 SQL 的 XML 位置
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 开启驼峰命名自动映射（如将数据库的 user_id 映射成 Java 的 userId）
    map-underline-to-camel-case: true
    # 答辩演示和调试神器：在控制台打印精美的 SQL 执行日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 🌟 自定义文件上传配置（告别硬编码，随时可在不改动代码的情况下切换路径）
file:
  upload-dir: D:/upload/   # 本地磁盘存储路径（如果换成Linux，直接在这里改成 /home/upload/ 即可）
  web-path: /upload/** # 静态资源映射的 URL 前缀
# 🌟 自定义安全配置

secure:
  admin-key: gly  # 🔑 这就是你的管理员注册授权密钥，可以随便修改